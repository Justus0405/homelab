services:
  server:
    image: "codeberg.org/forgejo/forgejo:16"
    container_name: "forgejo"
    restart: "unless-stopped"
    ports:
      - "5555:3000"
      - "2222:22"
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - USER_UID=1000
      - USER_GID=1000

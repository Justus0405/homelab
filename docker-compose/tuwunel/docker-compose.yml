services:
  tuwunel:
    image: "jevolk/tuwunel:latest"
    container_name: "tuwunel"
    restart: "unless-stopped"
    user: 1000:1000
    stop_grace_period: 30m
    ports:
      - "127.0.0.1:8008:6167"
    volumes:
      - ../../storage/tuwunel/data:/var/lib/tuwunel
    environment:
      TUWUNEL_SERVER_NAME: matrix.justus0405.com
      TUWUNEL_DATABASE_PATH: /var/lib/tuwunel
      TUWUNEL_PORT: 6167
      TUWUNEL_MAX_REQUEST_SIZE: 20000000 # In bytes, ~20 MB
      TUWUNEL_WELL_KNOWN__SERVER: matrix.justus0405.com:443
      TUWUNEL_WELL_KNOWN__CLIENT: https://matrix.justus0405.com
      TUWUNEL_IP_SOURCE: rightmost_x_forwarded_for
      TUWUNEL_ALLOW_REGISTRATION: "false" # Set this to true during first install
      #TUWUNEL_REGISTRATION_TOKEN: ${TUWUNEL_REGISTRATION_TOKEN}
      #TUWUNEL_EMERGENCY_PASSWORD: ${TUWUNEL_EMERGENCY_PASSWORD}
      TUWUNEL_ALLOW_FEDERATION: "true"
      TUWUNEL_TRUSTED_SERVERS: '["matrix.org"]'
      TUWUNEL_ADDRESS: 0.0.0.0
